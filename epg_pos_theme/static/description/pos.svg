<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#1A2F5A"/>
<stop offset="100%" stop-color="#0A1633"/>
</linearGradient>
<linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#35D0FF"/>
<stop offset="100%" stop-color="#0A4DFF"/>
</linearGradient>
<linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#223D75"/>
<stop offset="100%" stop-color="#132754"/>
</linearGradient>
</defs>
<rect x="10" y="10" width="80" height="80" rx="18" fill="url(#panelGrad)"/>
<!-- POS Terminal Base -->
<path d="M25,68 L75,68 L68,44 L32,44 Z" fill="url(#screenGrad)" stroke="url(#accentGrad)" stroke-width="1.5"/>
<!-- Screen -->
<rect x="36" y="48" width="28" height="14" rx="2" fill="#0E1F44" stroke="#35D0FF" stroke-width="1"/>
<!-- Cash Drawer -->
<rect x="30" y="70" width="40" height="6" rx="1" fill="url(#accentGrad)"/>
<!-- Keypad keys on terminal -->
<rect x="34" y="64" width="4" height="2" fill="#294A88"/>
<rect x="40" y="64" width="4" height="2" fill="#294A88"/>
<rect x="46" y="64" width="4" height="2" fill="#294A88"/>
<rect x="52" y="64" width="4" height="2" fill="#294A88"/>
<rect x="58" y="64" width="4" height="2" fill="#294A88"/>
<rect x="64" y="64" width="4" height="2" fill="#294A88"/>
<!-- Receipt Slot -->
<line x1="42" y1="40" x2="58" y2="40" stroke="#35D0FF" stroke-width="1.5"/>
<!-- Receipt Paper -->
<path d="M44,40 L44,30 L56,30 L56,40" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
<line x1="47" y1="33" x2="53" y2="33" stroke="#7FE6FF" stroke-width="1"/>
<line x1="47" y1="36" x2="53" y2="36" stroke="#7FE6FF" stroke-width="1"/>
</svg>
