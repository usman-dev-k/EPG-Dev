<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#1A2F5A"/>
<stop offset="100%" stop-color="#0A1633"/>
</linearGradient>
<linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#35D0FF"/>
<stop offset="100%" stop-color="#0A4DFF"/>
</linearGradient>
<linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#223D75"/>
<stop offset="100%" stop-color="#132754"/>
</linearGradient>
</defs>
<rect x="10" y="10" width="80" height="80" rx="18" fill="url(#panelGrad)"/>
<!-- Package/Box Isometric body -->
<!-- Top Face -->
<polygon points="50,22 74,32 50,42 26,32" fill="#294A88" stroke="url(#accentGrad)" stroke-width="1.2"/>
<!-- Left Face -->
<polygon points="26,32 50,42 50,72 26,62" fill="url(#boxGrad)" stroke="url(#accentGrad)" stroke-width="1.2"/>
<!-- Right Face -->
<polygon points="50,42 74,32 74,62 50,72" fill="#0E1F44" stroke="url(#accentGrad)" stroke-width="1.2"/>
<!-- Tape on Top -->
<polygon points="46,24 54,27 46,31 38,28" fill="#35D0FF" opacity="0.8"/>
<!-- Tape on Left Face -->
<polygon points="46,40 50,42 50,56 46,54" fill="#35D0FF" opacity="0.8"/>
<!-- Tape on Right Face -->
<polygon points="50,42 54,40 54,54 50,56" fill="#35D0FF" opacity="0.8"/>
</svg>
